# ─────────────────────────────────────────────────────────────────────────
# rtpengine.conf — media relay for NAT traversal
# This file documents the runtime flags; the container in docker-compose.yml
# is started with the equivalent command-line flags directly (rtpe/rtpengine
# image). This config is used by the Ansible `rtpengine` role for bare-metal
# deployments running the rtpengine daemon natively.
# ─────────────────────────────────────────────────────────────────────────

[rtpengine]
# Interface advertised to callers. In container dev "public" maps to the
# host; on bare metal set the public IP / interface name.
interface = public

# ng (next-generation) control protocol socket — Kamailio rtpengine module
# connects here (kamailio.cfg: rtpengine_sock udp:${RTPE_HOST:-rtpengine}:2223).
# On bare metal, 127.0.0.1 is fine (Kamailio + rtpengine on the same host).
listen-ng = 127.0.0.1:2223

# Media port range — MUST match Asterisk rtp.conf and docker-compose ports.
port-min = 10000
port-max = 20000

# Codec handling: transcode opus<->g711 for browser↔PSTN bridging.
# (Defaults are sensible; uncomment to enable explicit transcoding.)
# codec = opus,g722,ulaw,alaw,telephone-event

# DTLS-SRTP for WebRTC endpoints.
dtls-passive = no

# SDES-SRTP fallback for non-WebRTC TLS clients.
# sdes = yes

# Logging.
log-level = 5
log-protocol-errors = no

# PID file.
pidfile = /run/rtpengine.pid

# Table size for in-memory call tracking.
max-sessions = 5000
