; ─────────────────────────────────────────────────────────────
; extensions.conf — Asterisk dialplan
; All call legs are handed to the `pbx` Stasis application (handled by
; @pbx/telephony) so call control lives in the Node service, not in the
; dialplan. The dialplan only does entry-point routing + agent features.
; ─────────────────────────────────────────────────────────────

[default]
; Catch-all for any dialed digits: send into Stasis(pbx, ${EXTEN}).
; The Node ARI service resolves the destination (ext/ivr/queue) by tenant.
exten => _X.,1,NoOp(PBX default context: ${EXTEN})
 same => n,Stasis(pbx,${EXTEN})
 same => n,Hangup()

; Inbound legs from SIP trunks land here; the DID is ${EXTEN}.
[from-trunk]
exten => _X.,1,NoOp(Inbound from trunk: ${EXTEN})
 same => n,Stasis(pbx,${EXTEN})
 same => n,Hangup()

[from-internal]
; Agent-originated calls. Most go to Stasis for CDR + flow control, but a
; few star codes are handled here for convenience.
exten => _X.,1,NoOp(Internal call: ${EXTEN})
 same => n,Stasis(pbx,${EXTEN},internal)
 same => n,Hangup()

; ── Feature codes ─────────────────────────────────────────────
; Voicemail deposit/check
exten => *97,1,NoOp(Voicemail access)
 same => n,VoiceMailMain(${CALLERID(num)}@default,s)
 same => n,Hangup()

; DND toggle is owned by apps/api (presence state); dialplan just no-ops.
exten => *78,1,NoOp(DND on — handled by control plane)
 same => n,Hangup()
exten => *79,1,NoOp(DND off — handled by control plane)
 same => n,Hangup()

; Call pickup (directed) — *8<ext>
exten => _*8X.,1,PickupChan(PJSIP/${EXTEN:2})
 same => n,Hangup()

[stasis-default]
; Reserved context the Node service uses when it continues a channel after
; Stasis (e.g. after IVR digit collection). Kept empty intentionally; the
; service passes explicit context+exten+priority to /channels/{id}/continue.
