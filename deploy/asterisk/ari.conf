; ─────────────────────────────────────────────────────────────
; ari.conf — Asterisk REST Interface
; The password is injected by the Dockerfile envsubst entrypoint from the
; ${ARI_PASSWORD} environment variable (set in docker-compose.yml). On bare
; metal / Ansible the playbook writes the resolved value directly.
; ─────────────────────────────────────────────────────────────
[general]
enabled=yes
pretty=yes
allowed_origins=*
; The HTTP server (http.conf) must also be enabled; ARI rides on it.
; WebSocket events are served on the WSS port (8089) configured in http.conf.

; ARI user consumed by @pbx/telephony (basic auth user = ${ARI_USER}).
[asterisk]
type=user
username=${ARI_USER}
password=${ARI_PASSWORD}
read_only=no
