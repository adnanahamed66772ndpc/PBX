; ─────────────────────────────────────────────────────────────
; codecs.conf — preferred codec order
; Opus first for WebRTC clients, then wideband G.722, then G.711 (ulaw/alaw)
; for PSTN/legacy interoperability. Telephone-event carries DTMF in-band.
; ─────────────────────────────────────────────────────────────
[opus]
type=opus
; 20ms frames, mono, 48kHz — good default for WebRTC voice.
default_bitrate=20000
maximum_bandwidth=fullband
application=voip

[g722]
type=g722

[ulaw]
type=ulaw

[alaw]
type=alaw

[telephone-event]
; RFC 4733 DTMF telephone-event payload type.
type=telephone-event
