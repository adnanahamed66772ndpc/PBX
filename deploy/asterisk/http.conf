; ─────────────────────────────────────────────────────────────
; http.conf — Asterisk built-in HTTP server (serves ARI + WebSocket)
; ─────────────────────────────────────────────────────────────
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
prefix=

; TLS for the HTTP server. ARI over WSS (port 8089 mapped in compose) uses
; this TLS config. Cert/key are generated per deploy/asterisk/keys/README.md.
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/asterisk.pem
tlsprivatekey=/etc/asterisk/keys/asterisk.pem
; Require TLS 1.2+; disable legacy.
tlsdisablecipher=no
