; ─────────────────────────────────────────────────────────────
; rtp.conf — RTP port range
; Must match the docker-compose port range (10000-20000) and the rtpengine
; port range so firewall/NAT rules are consistent across the stack.
; ─────────────────────────────────────────────────────────────
[general]
rtpstart=10000
rtpend=20000
; Strict RTP improves security/NAT handling.
strictrtp=yes
; Enable ICE for WebRTC endpoints.
icesupport=yes
; Symmetric RTP helps with NAT traversal behind Kamailio.
rtpkeepalive=30
