; ─────────────────────────────────────────────────────────────
; modules.conf — ensure res_ari, res_pjsip, res_http_websocket, res_crypto
; and the prometheus/statsd bits are loaded. Asterisk autoloads most modules
; by default; this file makes the requirement explicit and survives distro
; changes that flip autoload off.
; ─────────────────────────────────────────────────────────────
[modules]
autoload=yes

; Core ARI + SIP stack
require => res_ari.so
require => res_pjsip.so
require => res_pjsip_acl.so
require => res_pjsip_authenticator_digest.so
require => res_pjsip_endpoint_identifier_ip.so
require => res_pjsip_endpoint_identifier_user.so
require => res_pjsip_session.so
require => res_http_websocket.so
require => res_crypto.so
require => res_srtp.so

; WebRTC/DTLS support for browser endpoints
require => res_rtp_asterisk.so
require => res_pjsip_transport_websocket.so

; Codec parsers
require => codec_opus.so
require => codec_g722.so
require => codec_ulaw.so
require => codec_alaw.so

; Recording (MixMonitor) for CDR recording_url
require => app_mixmonitor.so
require => app_chanspy.so

; Dialplan apps used by extensions.conf
require => app_stasis.so
require => app_voicemail.so
require => app_directed_pickup.so

; Stats — exported to the http server for Prometheus scrape (see prometheus.conf).
require => res_statsd.so
