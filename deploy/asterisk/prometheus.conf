; ─────────────────────────────────────────────────────────────
; prometheus.conf — Asterisk Prometheus exporter
; Exposes /metrics on the built-in HTTP server (http.conf, port 8088) for the
; Prometheus scrape configured in the ansible monitoring role. The Node ARI
; service does not export its own Asterisk metrics; we scrape Asterisk here.
;
; Note: native Prometheus export in Asterisk is via res_prometheus (a
; community module) or the statsd bridge. This config drives the statsd
; bridge; a dedicated res_prometheus build is out of scope for the container
; image. The monitoring role scrapes this endpoint and relabels.
; ─────────────────────────────────────────────────────────────
[general]
enabled=yes
; URI path served on the http.conf listener for scrapes.
uri=metrics
; Flush interval in seconds.
flush_interval=15

[statsd]
; Bridge Asterisk statsd counters to the local statsd exporter (optional).
enabled=yes
server=127.0.0.1
port=8125
prefix=asterisk.
