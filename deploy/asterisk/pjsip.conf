; ─────────────────────────────────────────────────────────────
; pjsip.conf — Asterisk PJSIP channel driver
; Template is envsubst-processed at container start by the Dockerfile
; entrypoint, so ${PUBLIC_HOST}, ${ARI_USER} etc. are resolved from the
; container environment (docker-compose sets them). On bare metal / Ansible,
; the playbook writes the resolved file directly.
; ─────────────────────────────────────────────────────────────

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; External address advertised in Contact/Via for NAT traversal. Set via env.
external_media_address=${PUBLIC_HOST}
external_signaling_address=${PUBLIC_HOST}
local_net=0.0.0.0/0

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
; TLS cert used for the WebSocket transport (WebRTC clients).
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.pem
method=tlsv1_2
external_media_address=${PUBLIC_HOST}
external_signaling_address=${PUBLIC_HOST}
local_net=0.0.0.0/0

; ── Endpoint template ─────────────────────────────────────────
; Shared defaults for all WebRTC SIP endpoints. The `(!)` marks it as a
; template; real endpoints inherit with `endpoint-template` in the first line.
[endpoint-template](!)
type=endpoint
context=default
disallow=all
allow=opus
allow=g722
allow=ulaw
allow=alaw
transport=transport-wss
webrtc=yes
; ICE/DTLS-SRTP required for browser WebRTC clients.
use_avpf=yes
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
dtls_verify=fingerprint
dtls_setup=actpass
dtls_auto_generate_cert=yes

[auth-template](!)
type=auth
auth_type=userpass

[aor-template](!)
type=aor
max_contacts=1
remove_existing=yes

; ── Example endpoints 1001 / 1002 ─────────────────────────────
[1001](endpoint-template)
auth=1001-auth
aors=1001
callerid=Device 1001 <1001>

[1001-auth](auth-template)
username=1001
password=1001secret

[1001](aor-template)

[1002](endpoint-template)
auth=1002-auth
aors=1002
callerid=Device 1002 <1002>

[1002-auth](auth-template)
username=1002
password=1002secret

[1002](aor-template)

; ── Admin endpoint (used by apps/api for originate/testing) ───
[admin](endpoint-template)
auth=admin-auth
aors=admin
callerid=PBX Admin <admin>

[admin-auth](auth-template)
; username comes from env ${ARI_USER} for parity with the ARI user.
username=${ARI_USER}
password=${ARI_PASSWORD}

[admin](aor-template)

; ── SIP trunk to upstream provider (template, enable per-tenant) ──
[trunk-template](!)
type=endpoint
context=from-trunk
disallow=all
allow=opus
allow=g722
allow=ulaw
transport=transport-udp
; rtp_keepalive keeps NAT pinholes open through Kamailio/rtpengine.
rtp_keepalive=30

[trunk-registration-template](!)
type=registration
transport=transport-udp
retry_interval=60
max_retries=20
expiration=3600
