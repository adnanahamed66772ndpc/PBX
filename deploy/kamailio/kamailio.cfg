#!KAMAILIO
# ─────────────────────────────────────────────────────────────────────────
# kamailio.cfg — edge SIP proxy / registrar / dispatcher
# Templates processed by envsubst at container start (Dockerfile entrypoint),
# so ${PUBLIC_HOST}, ${SIP_DOMAIN}, ${PUBLIC_IP} resolve from the container
# environment. On bare metal / Ansible the playbook writes the resolved file.
# ─────────────────────────────────────────────────────────────────────────

####### Global Parameters #########

debug=2
log_stderror=no
memdbg=5
memlog=5

# --- Listeners -----------------------------------------------------------
# UDP listener for plain SIP (NAT keeps most clients on TLS).
listen=udp:0.0.0.0:5060
# TLS listener advertised as the public host:port so Contact headers survive NAT.
listen=tls:${PUBLIC_IP}:5061 advertise "${PUBLIC_HOST}:5061"

# --- Domains / advertised address ---------------------------------------
alias="${SIP_DOMAIN}"
# ${PUBLIC_HOST} is the externally-resolvable hostname used in Record-Route.

# --- Process / fork ------------------------------------------------------
fork=yes
children=4
auto_aliases=no

# --- Paths ---------------------------------------------------------------
mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

####### Modules Section ###################################################

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "rr.so"
loadmodule "sl.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "dispatcher.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"
loadmodule "tls.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "db_postgres.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "textops.so"
loadmodule "htable.so"

# --- tm ------------------------------------------------------------------
modparam("tm", "fr_timer", 5)
modparam("tm", "fr_inv_timer", 30)
modparam("tm", "restart_fr_on_each_reply", 0)

# --- rr ------------------------------------------------------------------
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

# --- usrloc / registrar --------------------------------------------------
# Persist registrations to the control-plane Postgres (shared with apps/api).
modparam("usrloc", "db_mode", 3)
modparam("usrloc", "db_url", "postgres://${KAM_DB_USER:-pbx}:${KAM_DB_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-pbx}")
modparam("usrloc", "nat_bflag", "NAT_BFLAG")
modparam("registrar", "nat_flag", "NAT_BFLAG")
modparam("registrar", "received_avp", "$avp(received)")
modparam("registrar", "max_contacts", 1)

# --- auth_db -------------------------------------------------------------
modparam("auth_db", "db_url", "postgres://${KAM_DB_USER:-pbx}:${KAM_DB_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-pbx}")
modparam("auth_db", "calculate_ha1", 1)
modparam("auth_db", "password_column", "secret")
modparam("auth_db", "user_column", "ext_number")
modparam("auth_db", "table", "extensions")

# --- dispatcher ----------------------------------------------------------
# Two Asterisk nodes (see dispatcher.list). ds_select_dst picks one per set.
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_ping_interval", 10)
modparam("dispatcher", "ds_probing_mode", 2)
modparam("dispatcher", "ds_ping_reply_codes", "200;401;403;404;484")
modparam("dispatcher", "flags", 2)          # DS_FAILOVER
modparam("dispatcher", "dst_avp", "$avp(ds_dst)")
modparam("dispatcher", "grp_avp", "$avp(ds_grp)")
modparam("dispatcher", "cnt_avp", "$avp(ds_cnt)")
modparam("dispatcher", "sock_avp", "$avp(ds_sock)")

# --- rtpengine -----------------------------------------------------------
# Connect to the rtpengine ng control socket (rtpengine.conf listen-ng).
modparam("rtpengine", "rtpengine_sock", "udp:${RTPE_HOST:-rtpengine}:2223")
modparam("rtpengine", "rtpengine_tout_ms", 1000)
modparam("rtpengine", "extra_id_pv", "$avp(rtpengine_id)")

# --- nathelper -----------------------------------------------------------
modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "ping_nated_only", 1)
modparam("nathelper", "natping_tcp", 0)

# --- tls -----------------------------------------------------------------
# Separate tls.cfg holds cert paths; referenced here.
modparam("tls", "config", "/etc/kamailio/tls.cfg")
modparam("tls", "tls_force_run", 1)

####### Routing Logic #####################################################

request_route {

    # Per-message sanity: max forwards, parse, malformed detection.
    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1511", "6")) {
        xlog("L_WARN", "malformed SIP from $si:$sp\n");
        exit;
    }

    # NAT detection: set flag for UACs behind NAT and force rport.
    force_rport();
    if (nat_uac_test("19")) {
        setflag(NAT_BFLAG);
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else if (is_first_hop()) {
            set_contact_alias();
        }
    }

    # CANCEL / retransmission handling belongs to tm.
    if (is_method("CANCEL")) {
        if (t_check_trans()) route(RELAY);
        exit;
    }

    route(REQINIT);
    route(AUTHCHECK);

    # Record-Route so in-dialog requests stay on the proxy.
    if (!is_method("REGISTER|MESSAGE")) record_route();

    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    # Loose-route in-dialog requests.
    if (has_totag()) {
        if (loose_route()) {
            route(RTPENGINE);
            route(RELAY);
        } else {
            sl_send_reply("400", "Bad request (r-uri)");
        }
        exit;
    }

    # Initial requests: dispatch to Asterisk via the dispatcher set.
    route(DISPATCH);
    route(RTPENGINE);
    route(RELAY);
}

# --- Initial request housekeeping ----------------------------------------
route[REQINIT] {
    # Drop obvious scanners.
    if ($ua =~ "friendly-scanner|sipcli|VaxSIPUserAgent") {
        sl_send_reply("403", "Forbidden");
        exit;
    }
    return;
}

# --- Authenticate non-REGISTER requests from local endpoints ------------
# Registration auth is handled in REGISTER; for INVITEs from registered UACs
# we rely on the registration being present. Trunk auth is per-tenant (TODO).
route[AUTHCHECK] {
    if (is_method("INVITE|SUBSCRIBE|REFER") && from_uri==myself) {
        # Challenge UACs claiming a local identity but not authenticated.
        if (!src_ip == myself) {
            if (!www_authorize("${SIP_DOMAIN}", "extensions")) {
                www_challenge("${SIP_DOMAIN}", "0");
                exit;
            }
        }
    }
    return;
}

# --- REGISTER handling ---------------------------------------------------
route[REGISTER] {
    if (isflagset(NAT_BFLAG)) {
        set_contact_alias();
    }
    # Authenticate REGISTER against the extensions table (auth_db).
    if (!www_authorize("${SIP_DOMAIN}", "extensions")) {
        www_challenge("${SIP_DOMAIN}", "0");
        exit;
    }
    if (!save("location")) {
        sl_reply_error();
        exit;
    }
    # Republish presence via the control plane is out-of-scope here; the Node
    # telephony service subscribes to usrloc updates through apps/api.
    exit;
}

# --- Dispatcher selection ------------------------------------------------
route[DISPATCH] {
    # Set 1 = Asterisk cluster (see dispatcher.list). Failover flag is set.
    if (!ds_select_dst("1", "4")) {
        xlog("L_ERR", "no dispatcher destination available\n");
        sl_send_reply("503", "Service Unavailable");
        exit;
    }
    t_on_failure("RTF_DISPATCH");
    return;
}

# --- RTPengine manage (NAT traversal for media) --------------------------
route[RTPENGINE] {
    if (is_method("INVITE|ACK|BYE|CANCEL|UPDATE")) {
        if (isflagset(NAT_BFLAG) || !has_totag()) {
            rtpengine_manage("replace-origin replace-session-connection rtcp-mux-demux");
        }
    }
    return;
}

# --- Relay via tm --------------------------------------------------------
route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# --- Failure route: try next dispatcher destination ----------------------
failure_route[RTF_DISPATCH] {
    if (t_is_canceled()) exit;
    # Mark the failed destination and try the next one in the set.
    if (t_branch_timeout() || !t_branch_replied()) {
        xlog("L_WARN", "dispatcher destination failed, trying next\n");
        if (ds_next_dst()) {
            t_on_failure("RTF_DISPATCH");
            route(RTPENGINE);
            t_relay();
            exit;
        }
    }
    exit;
}

# --- onreply_route: fix Contact + rtpengine for replies ------------------
onreply_route {
    if (t_check_status("1[0-9][0-9]")) {
        if (isflagset(NAT_BFLAG)) set_contact_alias();
        route(RTPENGINE);
    } else if (t_check_status("2[0-9][0-9]")) {
        if (isflagset(NAT_BFLAG)) set_contact_alias();
        route(RTPENGINE);
    }
}

####### TLS Section (cert paths live in tls.cfg) ###########################
# tls.cfg is loaded via modparam("tls","config",...). See deploy/kamailio/tls.cfg
# and deploy/kamailio/kamailio-tls-README.md for cert generation.
