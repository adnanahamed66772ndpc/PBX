# ─────────────────────────────────────────────────────────────────────────
# tls.cfg — Kamailio TLS server/client configuration
# Loaded by modparam("tls", "config", "/etc/kamailio/tls.cfg") in kamailio.cfg.
# Cert paths point at the bundle generated per kamailio-tls-README.md.
# ${SIP_DOMAIN} is resolved by the Dockerfile envsubst entrypoint.
# ─────────────────────────────────────────────────────────────────────────

[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
# Server identity presented to SIP UACs over TLS (port 5061).
certificate = /etc/kamailio/tls/kamailio.pem
private_key = /etc/kamailio/tls/kamailio.pem
# CA list for verifying client certs when required (off by default for UACs).
ca_list = /etc/kamailio/tls/cacert.pem

[client:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
certificate = /etc/kamailio/tls/kamailio.pem
private_key = /etc/kamailio/tls/kamailio.pem
ca_list = /etc/kamailio/tls/cacert.pem

# Per-domain server block; advertise ${SIP_DOMAIN}.
[server:${SIP_DOMAIN}:5061]
method = TLSv1.2+
certificate = /etc/kamailio/tls/kamailio.pem
private_key = /etc/kamailio/tls/kamailio.pem
