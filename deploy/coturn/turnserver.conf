# ─────────────────────────────────────────────────────────────────────────
# turnserver.conf — coturn TURN/STUN relay for WebRTC ICE
# SECURITY: this is NOT an open relay. Long-term credentials are required.
# ${SIP_DOMAIN} / ${PUBLIC_HOST} are envsubst-resolved by the entrypoint.
# ─────────────────────────────────────────────────────────────────────────

# Listeners — STUN/TURN on 3478 (UDP+TCP), TURN-TLS on 5349.
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Relay address range — must match UFW rules (10000-20000) and Asterisk/rtpengine.
relay-ip=0.0.0.0
min-port=10000
max-port=20000

# Realm — must match the WebRTC endpoint configuration in apps/web.
realm=${SIP_DOMAIN}
server-name=${SIP_DOMAIN}

# TLS cert bundle for TURN-TLS (5349). Generated alongside Kamailio/Asterisk.
cert=/etc/coturn/tls/turn.pem
pkey=/etc/coturn/tls/turn.pem
# Disable legacy SSLv3/TLS1.0.
no-sslv2
no-sslv3
no-tlsv1
no-tlsv1_1

# ── Authentication: long-term credentials ────────────────────────────────
# Static shared user for the platform (apps/web computes the same credential
# pair). For multi-tenant/production scale, replace with the DB-backed auth
# (use-auth-secret) so each tenant gets rotating credentials; see comment below.
lt-cred-mech
user=pbxuser:${TURN_SHARED_SECRET:-change_me_secret}

# NO anonymous relay: never enable --no-auth in production. The two lines
# above (lt-cred-mech + user) gate every allocation. If you switch to
# time-limited credentials, use:
#   use-auth-secret
#   static-auth-secret=${TURN_STATIC_SECRET}
# and have apps/web generate HMAC credentials per session per RFC 5389.

# Disable the CLI management port (no remote admin shell).
no-cli

# Logging.
log-file=/var/log/turnserver.log
simple-log

# Mobility / IPv6 off for the initial single-stack deployment.
no-multicast-peers
no-loopback-peers
# Deny traffic to private RFC1918 space from being relayed (prevents abuse).
no-default-relay-ips
