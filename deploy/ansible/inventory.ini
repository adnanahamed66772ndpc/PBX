# deploy/ansible/inventory.ini
# Single target host for the PBX telephony stack. Group vars are inlined so the
# playbook can run with `ansible-playbook -i inventory.ini playbook.yml`.

[pbx]
pbx.example.com ansible_user=deploy ansible_ssh_private_key_file=~/.ssh/pbx_deploy

[pbx:vars]
# Public hostname / domain resolved by envsubst in the engine configs.
public_host=pbx.example.com
sip_domain=pbx.example.com
public_ip=203.0.113.10

# Telephony control-plane credentials (override in a vault in real deploys).
ari_user=asterisk
ari_password=CHANGE_ME_ASTRONG
telephony_token=CHANGE_ME_TELEPHONY_TOKEN
turn_shared_secret=CHANGE_ME_TURN

# Database (same DSN used by apps/api + @pbx/db).
postgres_db=pbx
postgres_user=pbx
postgres_password=CHANGE_ME_PG

# SIP trunking provider (optional; leave blank to disable outbound PSTN).
sip_trunk_host=
sip_trunk_user=
sip_trunk_password=
